databases:
  - name: roadwatch-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: roadwatch-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roadwatch-db
          property: connectionString
      - key: PORT
        value: "3000"
