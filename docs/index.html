<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26282a">
<title>RoadWatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--asphalt:#26282a;--paper:#f7f5f0;--amber:#f2a93b;--red:#c4432b;--green:#4c7a5e;--ink:#1c1d1e;--soft:#6b6b68;--line:#d8d3c8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,sans-serif;background:var(--asphalt);color:var(--ink);overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--asphalt);color:var(--paper);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--amber);z-index:20;flex:none}
h1{font-family:Oswald,sans-serif;font-size:19px;margin:0}
.tag{font-size:11.5px;color:#b9b6ae}
.list-toggle{background:#37393c;color:var(--paper);border:1px solid #4a4c4e;border-radius:8px;padding:9px 14px;font-weight:600}
#count{background:var(--amber);color:var(--ink);border-radius:20px;padding:1px 7px;font-size:11px;margin-left:6px}
main{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0;background:#1c242c}
.leaflet-container{background:#1c242c;font-family:Inter,sans-serif}
#panel{width:min(460px,100%);background:var(--paper);position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);transition:transform .25s;z-index:1600;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.25)}
#panel.open{transform:none}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}#panelClose{border:0;background:#e9e6df;border-radius:10px;padding:10px 12px;font-family:Oswald,sans-serif}.rank{width:32px;font-family:Oswald,sans-serif;font-size:22px;text-align:center}
.panel-head h2{font-family:Oswald,sans-serif;margin:0 0 4px;font-size:16px}
.panel-head p{margin:0;font-size:12px;color:var(--soft)}
#panelList{flex:1;overflow:auto;padding:8px 10px}
.empty{padding:30px 16px;text-align:center;color:var(--soft);line-height:1.6}
.item{display:flex;gap:11px;padding:11px 8px;border:0;background:transparent;width:100%;text-align:left;border-bottom:1px solid #eeece5}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#e9e6df}
.sev{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
.sev-priority{background:var(--red)}.sev-confirmed{background:var(--amber);color:var(--ink)}.sev-reported{background:var(--green)}.sev-danger{background:#7a1f14}.how{font-size:12.5px;color:#6b6b68;margin:0 0 8px}.sev-pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.sev-pick button{width:auto;margin:0;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-weight:600}.sev-pick button.on{background:#1c1d1e;color:#fff;border-color:#1c1d1e}
.votes{font-family:Oswald,sans-serif;font-size:20px;font-weight:700}.item{cursor:pointer}.sev-word,.note-word{cursor:pointer}.note-word{font-size:13px;margin-top:3px;font-weight:600}
.ui{position:fixed;z-index:1100;pointer-events:none}
.fabs{right:14px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.zoombar{left:14px;top:78px;display:flex;flex-direction:column}
.fab,.zbtn,.report{pointer-events:auto;-webkit-tap-highlight-color:transparent}
.fab,.zbtn{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:22px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.zbtn{border-radius:0}
.zbtn:first-child{border-radius:10px 10px 0 0}
.zbtn:last-child{border-radius:0 0 10px 10px;border-top:0}
.fab.active{background:linear-gradient(135deg,var(--green),var(--amber) 55%,var(--red))}
.report{background:var(--amber);border:0;border-radius:30px;padding:14px 22px;font-family:Oswald,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:var(--asphalt);color:var(--paper);padding:9px 16px;border-radius:8px;opacity:0;z-index:1300;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.legend{position:fixed;left:14px;bottom:120px;background:rgba(38,40,42,.9);color:var(--paper);padding:9px 12px;border-radius:9px;width:130px;z-index:1100;font-size:10px}
.bar{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));margin-top:4px}
.back{position:fixed;inset:0;background:rgba(20,20,20,.72);display:none;align-items:flex-end;justify-content:center;z-index:1400}
.back.open{display:flex}
.modal{background:var(--paper);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px;max-height:88vh;overflow:auto}
.zone{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:#e9e6df;margin-bottom:14px}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;font:13.5px Inter}
.loc{background:#e9e6df;border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--soft);margin-bottom:16px}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:10px;padding:13px;font-family:Oswald,sans-serif}
.cancel{background:#e9e6df}.go{background:var(--amber)}.go:disabled{opacity:.45}
.preview img{width:100%;max-height:200px;object-fit:cover;border-radius:12px}
.pin-wrap{background:transparent;border:0}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}

.routebox{position:fixed;z-index:1150;left:70px;right:14px;top:74px}
.routebox form{display:flex;gap:8px}
.routebox input{flex:1;width:auto;margin:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#routeGo,#routeClear{border:0;border-radius:10px;background:var(--amber);font-family:Oswald,sans-serif;padding:0 14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#routeClear{background:#fff}
#suggest{background:#fff;border-radius:10px;margin-top:6px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18);max-height:180px;overflow:auto}
.sug{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 12px;font:13px Inter}
#routeNote{margin-top:6px;background:var(--asphalt);color:var(--paper);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.4}
.toast{top:auto;bottom:96px}
#langMenu{position:fixed;top:62px;right:14px;z-index:1700;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:140px}#langMenu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px 14px;font:14px Inter}#langMenu button.on{background:#26282a;color:#f7f5f0}.head-actions{display:flex;gap:8px;align-items:center}</style>
</head>
<body>
<div id="app">
<header>
  <div><h1>RoadWatch</h1><div class="tag" data-i18n="tag">Live community map</div></div>
  <div class="head-actions">
    <button class="list-toggle" id="langBtn" type="button" aria-label="Language">EN</button>
    <button class="list-toggle" id="panelToggle" type="button"><span data-i18n="priList">Priority list</span> <span id="count">0</span></button>
  </div>
</header>
<main><div id="map"></div></main>
</div>
<aside id="panel"><div class="panel-head"><button id="panelClose" type="button" data-i18n="map">Map</button><div><h2 data-i18n="rankings">Rankings</h2><p data-i18n="rankHint">Sorted by how bad the road is. Tap a row to open it.</p></div></div><div id="panelList"></div></aside>
<div class="ui zoombar">
  <button class="zbtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
  <button class="zbtn" id="zoomOut" type="button" aria-label="Zoom out">−</button>
</div>
<div class="ui fabs">
  <button class="fab active" id="heatBtn" type="button" title="Hotspots" aria-label="Hotspots"></button>
  <button class="fab" id="locateBtn" type="button" title="My location" aria-label="My location">⌖</button>
  <button class="report" id="reportBtn" type="button" data-i18n="report">Report damage</button>
</div>
<div class="routebox" id="routeBox">
  <form id="routeForm">
    <input id="dest" type="search" data-i18n-ph="dest" placeholder="Where to? Bad roads are avoided" autocomplete="off" enterkeyhint="search">
    <button id="routeGo" type="submit" data-i18n="route">Route</button>
    <button id="routeClear" type="button" hidden data-i18n="clear">Clear</button>
  </form>
  <div id="suggest" hidden></div>
  <div id="routeNote" hidden></div>
</div>
<div class="legend" id="legend"><div data-i18n="hotspot">Hotspot density</div><div class="bar"></div></div>
<div id="langMenu" hidden></div>
<div class="toast" id="toast"></div>
<div class="back" id="back">
<div class="modal">
<h2 style="font-family:Oswald,sans-serif;margin:0 0 6px" data-i18n="reportTitle">Report road damage</h2>
<p style="color:#6b6b68;font-size:12.5px" data-i18n="reportHelp">Photo and GPS. A nearby report adds a confirm instead of a second pin.</p>
<label class="zone" id="zone"><span data-i18n="photo">Tap to take or choose a photo</span><input id="file" type="file" accept="image/*" capture="environment" hidden></label>
<div class="preview" id="preview" hidden><img id="previewImg" alt=""><button type="button" id="retake" data-i18n="retake">Retake</button></div>
<div class="loc" id="loc" data-i18n="finding">Finding your location…</div>
<input id="phone" type="tel" data-i18n-ph="phonePh" placeholder="Your phone number">
<p class="how" data-i18n="how">How bad is the road?</p>
<div class="sev-pick" id="sevPick">
  <button type="button" data-sev="minor" data-i18n="minor">Minor</button>
  <button type="button" data-sev="rough" data-i18n="rough">Rough</button>
  <button type="button" data-sev="severe" data-i18n="severe">Severe</button>
  <button type="button" data-sev="dangerous" data-i18n="dangerous">Dangerous</button>
</div>
<input id="note" type="text" data-i18n-ph="notePh" placeholder="Short note (optional)" maxlength="140">
<div class="actions"><button class="btn cancel" id="cancel" type="button" data-i18n="cancel">Cancel</button><button class="btn go" id="submit" type="button" disabled data-i18n="submit">Submit report</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>

let lang=localStorage.getItem('roadwatch-lang')||'en';
if(!I18N[lang]) lang='en';
let lastNote=null;
function tr(k){const pack=I18N[lang]||I18N.en;let s=(pack[k]!=null?pack[k]:(I18N.en[k]!=null?I18N.en[k]:k));for(let i=1;i<arguments.length;i++)s=s.split('{'+(i-1)+'}').join(String(arguments[i]));return s}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.getAttribute('data-i18n'))});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=tr(el.getAttribute('data-i18n-ph'))});
  const b=$('langBtn'); if(b) b.textContent=lang.toUpperCase();

}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
const WORDS={minor:{c:'#4c7a5e',k:'sev-reported',r:1},rough:{c:'#e0a106',k:'sev-confirmed',r:2},severe:{c:'#c4432b',k:'sev-priority',r:3},dangerous:{c:'#7a1f14',k:'sev-danger',r:4}};
function sevOf(p){if(p&&WORDS[p.severity])return Object.assign({l:tr(p.severity)},WORDS[p.severity]);const v=(p&&p.votes)||1;if(v>=5)return{l:tr('priority'),c:'#c4432b',k:'sev-priority',r:3};if(v>=2)return{l:tr('confirmed'),c:'#f2a93b',k:'sev-confirmed',r:2};return{l:tr('reported'),c:'#4c7a5e',k:'sev-reported',r:1}}
function ago(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),k=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(k),Math.sqrt(1-k))}
function pinIcon(color){return L.divIcon({className:'pin-wrap',html:'<div class="pin" style="background:'+color+'"></div>',iconSize:[26,26],iconAnchor:[13,24],popupAnchor:[0,-22]})}
function load(){
  try{pins=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('roadwatch-live-v1')||'[]')}catch(e){pins=[]}
  if(!Array.isArray(pins))pins=[];
  pins=pins.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));
  draw();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(pins));return}
  catch(e){
    const lite=pins.map(p=>({id:p.id,lat:p.lat,lng:p.lng,accuracy:p.accuracy,votes:p.votes,note:p.note||'',severity:p.severity||'',firstReported:p.firstReported,voters:p.voters||[],photo:''}));
    try{localStorage.setItem(KEY,JSON.stringify(lite));toast(tr('photoBig'))}
    catch(e2){toast(tr('noStore'))}
  }
}
function popupHtml(p,s){
  const img=p.photo?'<img src="'+p.photo+'" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:6px">':'';
  const note=p.note?'<div>'+String(p.note).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>':'';
  return img+'<div><b>'+s.l+'</b> · '+tr(p.votes===1?'oneReport':'manyReports', p.votes)+'</div>'+note+'<div style="color:#6b6b68">'+ago(p.firstReported)+'</div>';
}
function syncHeat(){
  if(heat){map.removeLayer(heat);heat=null}
  if(!heatOn||zooming||!pins.length||map.getZoom()<12)return;
  heat=L.heatLayer(pins.map(p=>[p.lat,p.lng,sevOf(p).r]),{radius:28,blur:22,max:5,minOpacity:.28,gradient:{0:'#4c7a5e',.6:'#f2a93b',1:'#c4432b'}}).addTo(map);
}
function draw(){
  $('count').textContent=pins.length;
  markers.clearLayers();
  pins.forEach(p=>{
    const s=sevOf(p);
    L.circle([p.lat,p.lng],{radius:20,color:s.c,weight:2,fillColor:s.c,fillOpacity:.18,pane:'pins'}).addTo(markers);
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(s.c),pane:'pins',zIndexOffset:500+ (p.votes||1)}).addTo(markers);
    m.bindPopup(popupHtml(p,s));
    p._m=m;
  });
  syncHeat();
  const list=$('panelList');
  list.replaceChildren();
  if(!pins.length){list.innerHTML='<div class="empty">'+tr('empty')+'</div>';return}
  const sorted=pins.slice().sort((a,b)=>((sevOf(b).r*100)+(b.votes||1))-((sevOf(a).r*100)+(a.votes||1)));
  sorted.forEach((p,i)=>{
    const s=sevOf(p);
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='item';
    const rank=document.createElement('div');
    rank.className='rank';
    rank.textContent=String(i+1);
    const thumb=document.createElement(p.photo?'img':'div');
    thumb.className='thumb';
    if(p.photo)thumb.src=p.photo;
    const body=document.createElement('div');
    body.style.flex='1';
    const word=document.createElement('span');
    word.className='sev '+s.k+' sev-word';
    word.textContent=s.l;
    const when=document.createElement('div');
    when.style.cssText='font-size:11.5px;color:#6b6b68';
    when.textContent=ago(p.firstReported);
    body.append(word,when);
    if(p.note){
      const note=document.createElement('div');
      note.className='note-word';
      note.textContent=p.note;
      body.append(note);
    }
    const votes=document.createElement('div');
    votes.className='votes';
    votes.textContent=String(p.votes||1);
    btn.append(rank,thumb,body,votes);
    btn.onclick=()=>goToReport(p);
    list.append(btn);
  });
}
function goToReport(p){
  $('panel').classList.remove('open');
  setTimeout(()=>{
    map.invalidateSize();
    map.flyTo([p.lat,p.lng],18,{duration:.6});
    if(p._m)p._m.openPopup();
  },260);
}
function showMe(lat,lng,acc){

    accCircle=L.circle([lat,lng],{radius:20,color:'#2563eb',weight:2,fillColor:'#3b82f6',fillOpacity:.15,pane:'me'}).addTo(map);
    me=L.circleMarker([lat,lng],{radius:7,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1,pane:'me'}).addTo(map);

    accCircle.setLatLng([lat,lng]);

function freshFix(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){rej(new Error('no gps'));return}

}
function locate(recenter){
  if(!navigator.geolocation){toast(tr('noGps'));return}
  navigator.geolocation.getCurrentPosition(pos=>{
    showMe(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);
    if(recenter)map.setView([pos.coords.latitude,pos.coords.longitude],16);
  },()=>toast(tr('allowGps')),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
function compress(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=360;
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.5));
      };
      img.onerror=()=>rej(new Error('photo'));
      img.src=r.result;
    };
    r.onerror=()=>rej(new Error('read'));
    r.readAsDataURL(file);
  });
}

  $('back').classList.add('open');
  photo=null;reportPos=null;reportSev=null;
  $('preview').hidden=true;$('zone').style.display='block';$('file').value='';
  $('sevPick').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  $('loc').textContent=tr('finding');$('note').value='';ready();
  stopWatch();
  if(!navigator.geolocation){$('loc').textContent=tr('noGpsPhone');return}
  reportWatch=navigator.geolocation.watchPosition(pos=>{
    if(!photo)applyFix(pos);
  },()=>{$('loc').textContent=tr('allowAgain')},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
};
$('cancel').onclick=()=>{stopWatch();$('back').classList.remove('open')};
$('back').onclick=e=>{if(e.target===$('back'))$('back').classList.remove('open')};
$('zone').onclick=()=>$('file').click();
$('retake').onclick=()=>{photo=null;reportPos=null;$('preview').hidden=true;$('zone').style.display='block';$('file').value='';$('loc').textContent=tr('retakeLoc');ready()};
$('file').onchange=async()=>{
  const f=$('file').files[0];
  if(!f)return;
  try{photo=await compress(f)}catch(e){toast(tr('badPhoto'));return}
  $('previewImg').src=photo;$('preview').hidden=false;$('zone').style.display='none';
  reportPos=null;ready();
  $('loc').textContent=tr('photoTaken');
  try{applyFix(await freshFix())}
  catch(e){$('loc').textContent=tr('noUpdate');toast(tr('locToast'))}
};
$('phone').oninput=ready;
$('sevPick').onclick=e=>{const b=e.target.closest('button');if(!b)return;reportSev=b.dataset.sev;$('sevPick').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));ready()};

$('phone').value=localStorage.getItem('roadwatch-phone')||'';
$('submit').onclick=async()=>{
  if(!photo){toast(tr('needPhoto'));return}
  $('loc').textContent=tr('checking');
  try{applyFix(await freshFix())}catch(e){}
  if(!reportPos || Date.now()-(reportPos.at||0)>30000){toast(tr('stale'));return}
  const phone=$('phone').value.replace(/\D/g,'');
  let match=null,best=1e9;
  pins.forEach(p=>{
    const d=hav(reportPos.lat,reportPos.lng,p.lat,p.lng);
    const rad=20;
    if(d<=rad&&d<best){best=d;match=p}
  });
  if(match){
    if((match.voters||[]).includes(phone)){toast(tr('already'));return}
    match.votes=(match.votes||1)+1;
    match.voters=match.voters||[];
    match.voters.push(phone);
    if(!match.photo)match.photo=photo;
    if(WORDS[reportSev]&&(!WORDS[match.severity]||WORDS[reportSev].r>WORDS[match.severity].r))match.severity=reportSev;
  }else{
    pins.push({id:'p_'+Date.now(),lat:reportPos.lat,lng:reportPos.lng,accuracy:reportPos.acc||15,votes:1,photo,note:$('note').value.trim(),severity:reportSev,firstReported:new Date().toISOString(),voters:[phone]});
  }
  stopWatch();
  localStorage.setItem('roadwatch-phone',phone);
  save();
  draw();
  $('back').classList.remove('open');
  const target=match||pins[pins.length-1];
  map.setView([target.lat,target.lng],17);
  setTimeout(()=>{if(target._m)target._m.openPopup()},300);
  toast(match?tr('confirmedPin'):tr('dropped'));
};

let routeLayer=null,destPos=null,suggestTimer=null;
function segDist(lat,lng,a,b){
  const mlat=111320, mlng=111320*Math.cos(lat*Math.PI/180);
  const x=lng*mlng, y=lat*mlat, x1=a[0]*mlng, y1=a[1]*mlat, x2=b[0]*mlng, y2=b[1]*mlat;
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let u=l2?((x-x1)*dx+(y-y1)*dy)/l2:0;
  u=Math.max(0,Math.min(1,u));
  return Math.hypot(x-(x1+u*dx), y-(y1+u*dy));
}
function hitsOn(coords){
  const bad=[];
  if(!coords||coords.length<2) return bad;
  pins.forEach(p=>{
    let best=1e9;
    const step=coords.length>2500?2:1;
    for(let i=step;i<coords.length;i+=step){
      const d=segDist(p.lat,p.lng,coords[i-step],coords[i]);
      if(d<best) best=d;
      if(best<=28) break;
    }
    if(best<=28) bad.push(p);
  });
  return bad;
}
function sidePoints(pin,coords){
  let bi=1, bd=1e9;
  for(let i=1;i<coords.length;i++){
    const d=segDist(pin.lat,pin.lng,coords[i-1],coords[i]);
    if(d<bd){bd=d;bi=i}
  }
  const a=coords[bi-1], b=coords[bi];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const len=Math.hypot(dx,dy)||1e-9;
  const ux=-dy/len, uy=dx/len;
  const mlat=90/111320, mlng=90/(111320*Math.cos(pin.lat*Math.PI/180));
  return [{lat:pin.lat+uy*mlat,lng:pin.lng+ux*mlng},{lat:pin.lat-uy*mlat,lng:pin.lng-ux*mlng}];
}
async function osrm(points,alts){
  const path=points.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
  const url='https://router.project-osrm.org/route/v1/driving/'+path+'?overview=full&geometries=geojson&alternatives='+(alts?'true':'false');
  const r=await fetch(url);
  if(!r.ok) throw new Error('route');
  const j=await r.json();
  if(!j.routes||!j.routes.length) throw new Error('noroute');
  return j.routes.map(rt=>({coords:rt.geometry.coordinates,km:rt.distance/1000,min:rt.duration/60}));
}
function showRoute(rt,directBad){
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}
  const latlngs=rt.coords.map(c=>[c[1],c[0]]);
  routeLayer=L.polyline(latlngs,{color:rt.bad.length?'#c4432b':'#1d4ed8',weight:6,opacity:.92}).addTo(map);
  map.fitBounds(routeLayer.getBounds(),{padding:[120,48]});
  const note=$('routeNote');
  note.hidden=false;
  $('routeClear').hidden=false;
  const mins=Math.max(1,Math.round(rt.min));
  const km=rt.km<10?rt.km.toFixed(1):String(Math.round(rt.km));
  if(!rt.bad.length && directBad) lastNote=['rerouted',km,mins];
  else if(rt.bad.length) lastNote=[rt.bad.length>1?'noClearMany':'noClear',rt.bad.length,km,mins];
  else lastNote=['clearRoad',km,mins];
  note.textContent=tr.apply(null,lastNote);
}
async function planRoute(){
  if(!myPos){toast(tr('needStart'));locate(true);return}
  if(!destPos){toast(tr('needDest'));return}
  $('routeGo').disabled=true;
  $('routeNote').hidden=false;
  $('routeNote').textContent=tr('checkingRoads');
  try{
    const routes=await osrm([myPos,destPos],true);
    let best=null;
    routes.forEach(rt=>{
      const bad=hitsOn(rt.coords);
      const score=bad.length*100000+rt.min;
      if(!best||score<best.score) best={...rt,bad,score};
    });
    const directBad=best.bad.length;
    if(directBad){
      const blockers=best.bad.slice(0,3);
      for(const pin of blockers){
        for(const side of sidePoints(pin,best.coords)){
          try{
            const via=(await osrm([myPos,side,destPos],false))[0];
            const bad=hitsOn(via.coords);
            const score=bad.length*100000+via.min+1;
            if(score<best.score) best={...via,bad,score};
          }catch(e){}
        }
      }
    }
    showRoute(best,directBad);
  }catch(e){
    $('routeNote').textContent=tr('routeFail');
    toast(tr('routeToast'));
  }
  $('routeGo').disabled=false;
}
async function searchDest(q){
  const box=$('suggest');
  if(q.trim().length<2){box.hidden=true;box.innerHTML='';return}
  const bias=myPos?('&lat='+myPos.lat+'&lon='+myPos.lng):'';
  const r=await fetch('https://photon.komoot.io/api/?limit=5&q='+encodeURIComponent(q)+bias);
  const j=await r.json();
  const feats=j.features||[];
  if(!feats.length){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML='';
  feats.forEach(f=>{
    const props=f.properties||{};
    const label=[props.name,props.street,props.city,props.state,props.country].filter(Boolean);
    const text=[...new Set(label)].slice(0,3).join(', ')||q;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='sug';
    btn.textContent=text;
    btn.onclick=()=>{
      destPos={lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};
      $('dest').value=text;
      box.hidden=true;
      planRoute();
    };
    box.append(btn);
  });
}
$('routeForm').onsubmit=async e=>{
  e.preventDefault();
  $('suggest').hidden=true;
  if(!destPos){
    try{await searchDest($('dest').value)}catch(err){toast(tr('searchFail'));return}
    const first=$('suggest').querySelector('.sug');
    if(first){first.click();return}
    toast(tr('noPlace'));
    return;
  }
  planRoute();
};
$('dest').oninput=()=>{
  destPos=null;
  clearTimeout(suggestTimer);
  suggestTimer=setTimeout(()=>searchDest($('dest').value).catch(()=>{}),280);
};
$('routeClear').onclick=()=>{
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}
  destPos=null;
  $('dest').value='';
  $('suggest').hidden=true;
  $('routeNote').hidden=true;
  $('routeClear').hidden=true;
};

$('langBtn').onclick=()=>{
  const menu=$('langMenu');
  if(!menu.hidden){menu.hidden=true;return}
  menu.innerHTML='';
  [['en','English'],['hi','हिन्दी'],['kn','ಕನ್ನಡ'],['mr','मराठी'],['ta','தமிழ்'],['te','తెలుగు']].forEach(([code,name])=>{
    const b=document.createElement('button');
    b.type='button';
    b.textContent=name;
    if(code===lang) b.className='on';
    b.onclick=()=>{lang=code;localStorage.setItem('roadwatch-lang',code);menu.hidden=true;applyLang()};
    menu.append(b);
  });
  menu.hidden=false;
};
document.addEventListener('click',e=>{if(!e.target.closest('#langBtn')&&!e.target.closest('#langMenu')){$('langMenu').hidden=true}});
load();
applyLang();
locate(false);
</script>
