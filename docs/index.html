<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141618">
<title>RoadWatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700" rel="stylesheet">
<style>
:root{--ink:#202124;--muted:#5f6368;--blue:#1a73e8;--line:#e8eaed;--shadow:0 2px 4px rgba(0,0,0,.2),0 -1px 0 rgba(0,0,0,.02)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Roboto,Arial,sans-serif;background:#e5e3df;color:var(--ink);overflow:hidden}
button,input{font-family:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #1a73e8;outline-offset:1px}
#app{height:100dvh}
header{position:absolute;z-index:1200;top:0;left:0;right:0;padding:0;background:transparent;border:0;pointer-events:none}
.gmbar{pointer-events:auto;display:flex;align-items:center;width:min(720px,calc(100% - 16px));height:52px;margin:12px auto 0;background:#fff;border-radius:26px;box-shadow:0 2px 8px rgba(0,0,0,.28);overflow:hidden}
#menuBtn{width:48px;height:48px;border:0;background:transparent;color:#5f6368;flex:none;display:grid;place-items:center}
#menuBtn svg{display:block}
#routeForm{display:flex;align-items:center;flex:1;min-width:0;height:48px;gap:0;background:transparent;margin:0;padding:0}
#dest{flex:1;min-width:0;height:48px;border:0;margin:0;padding:0 8px 0 0;background:transparent;font-size:15px;color:#202124;border-radius:0;box-shadow:none}
#dest::placeholder{color:#80868b}
#routeGo,#routeClear{height:36px;border:0;background:transparent;color:#1a73e8;font-weight:500;font-size:14px;padding:0 12px;border-radius:18px;white-space:nowrap}
#routeGo:hover,#menuBtn:hover{background:#f1f3f4}
#routeClear{color:#5f6368}
.routebox{position:fixed;z-index:1200;left:10px;top:66px;width:min(392px,calc(100% - 20px));pointer-events:none}
#suggest{pointer-events:auto;background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.3);max-height:280px;overflow:auto;margin-top:8px}
.sug{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f1f3f4;background:#fff;padding:12px 16px;font:14px Roboto,Arial,sans-serif;color:#202124}
.sug:hover{background:#f8f9fa}
#routeNote{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;max-width:none;background:#fff;color:#202124;border-radius:8px 8px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));font-size:14px;line-height:1.4;box-shadow:0 -2px 8px rgba(0,0,0,.2);pointer-events:none;z-index:26}
@media(min-width:900px){#routeNote{left:10px;right:auto;bottom:24px;width:392px;border-radius:8px}}
#menuScrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1640}
#menuScrim[hidden]{display:none}
#appMenu{position:fixed;z-index:1650;top:0;left:0;bottom:0;width:min(300px,88vw);background:#fff;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.28);padding:8px 0 16px;overflow:auto}
#appMenu.open{transform:none}
.menu-brand{padding:20px 24px 12px;border-bottom:1px solid #e8eaed}
h1{font:500 22px Roboto,Arial,sans-serif;margin:0;color:#202124;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:14px;height:14px;border-radius:50% 50% 50% 0;background:#ea4335;transform:rotate(-45deg);flex:none}
.tag{color:#5f6368;font-size:12px;margin-top:4px}
.head-actions{display:flex;flex-direction:column;padding-top:8px}
.list-toggle{background:transparent;color:#202124;border:0;border-radius:0;text-align:left;padding:14px 24px;font-weight:400;font-size:15px;width:100%;box-shadow:none}
.list-toggle:hover{background:#f1f3f4}
#themeBtn,#langBtn{width:100%;height:auto;font-size:15px;border-radius:0}
#count{background:#1a73e8;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:8px}
#langMenu{position:fixed;top:0;bottom:0;left:min(300px,88vw);z-index:1660;background:#fff;width:min(240px,70vw);border-radius:0;box-shadow:4px 0 16px rgba(0,0,0,.15);overflow:auto;max-height:none}
#langMenu[hidden]{display:none}
#langMenu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f1f3f4;background:#fff;padding:14px 16px;font:15px Roboto,Arial,sans-serif;color:#202124}
#langMenu button.on{background:#e8f0fe;color:#1967d2}
main,#map,.leaflet-container{height:100%;background:#e5e3df}
#map{position:absolute;inset:0;z-index:0}
.leaflet-container{font-family:Roboto,Arial,sans-serif;z-index:0}
.leaflet-popup-content-wrapper{border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-popup-content{margin:12px;font-size:13.5px}
.leaflet-popup-content img{border-radius:8px;margin-bottom:6px}
.leaflet-control-attribution{font-size:10px!important;background:rgba(255,255,255,.8)!important;color:#5f6368}
#panel{width:min(408px,100%);background:#fff;position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .2s ease;z-index:1600;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#panel.open{transform:none}
.panel-head{padding:16px;border-bottom:1px solid #e8eaed;display:flex;gap:12px;align-items:center}
#panelClose{border:0;background:transparent;color:#1a73e8;font-weight:500;border-radius:4px;padding:8px 10px}
.panel-head h2{font:400 20px Roboto,Arial,sans-serif;margin:0 0 2px;color:#202124}
.panel-head p{margin:0;font-size:12.5px;color:#5f6368}
.rank{width:28px;color:#1a73e8;font-weight:500;text-align:center}
#panelList{flex:1;overflow:auto}
.empty{padding:36px 20px;text-align:center;color:#5f6368}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #f1f3f4;background:#fff;padding:12px 16px;border-radius:0;margin:0}
.item:hover{background:#f8f9fa}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#f1f3f4;flex:none}
.sev{display:inline-block;font-size:12px;font-weight:500;padding:2px 6px;border-radius:4px;color:#fff}
.sev-priority{background:#d93025}.sev-confirmed{background:#f9ab00;color:#202124}.sev-reported{background:#188038}.sev-danger{background:#a50e0e}
.votes{margin-left:auto;font-size:18px;font-weight:500}
.note-word{font-size:13px;margin-top:2px;color:#3c4043}
.how{font-size:13px;font-weight:500;color:#3c4043;margin:8px 0}
.sev-pick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.sev-pick button{width:auto;margin:0;border:1px solid #dadce0;background:#fff;border-radius:16px;padding:8px 12px;font-weight:500;color:#3c4043}
.sev-pick button.on{background:#e8f0fe;color:#1a73e8;border-color:#d2e3fc}
.ui{position:fixed;z-index:1200;pointer-events:none}
.zoombar{position:fixed;z-index:1200;right:16px;left:auto;bottom:120px;top:auto;width:40px;display:flex;flex-direction:column;background:#fff;border-radius:2px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.3);filter:none}
.zbtn{width:40px;height:40px;border:0;border-bottom:1px solid #e6e6e6;border-radius:0;background:#fff;font-size:20px;color:#666;box-shadow:none;margin:0}
#mapTheme{border-bottom:0;font-size:16px}
.fabs{position:fixed;z-index:1200;left:12px;right:72px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:row;gap:8px;align-items:center;justify-content:flex-start}
.fab{pointer-events:auto;width:40px;height:40px;border:0;border-radius:2px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);color:#666;font-size:20px}
#locateBtn{color:#1a73e8;border-radius:50%;width:40px;height:40px}
#heatBtn{display:grid;place-items:center}
#heatBtn::before{content:"";width:16px;height:16px;border-radius:50%;background:conic-gradient(#188038,#f9ab00 55%,#d93025)}
#heatBtn:not(.active)::before{filter:grayscale(1);opacity:.4}
.report{pointer-events:auto;position:static;transform:none;z-index:1200;background:#1a73e8;color:#fff;border:0;border-radius:24px;padding:12px 16px;font-weight:500;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.report:active{transform:none;background:#f8f9fa}
.legend{position:fixed;z-index:1100;left:8px;bottom:78px;background:rgba(255,255,255,.9);color:#5f6368;padding:6px 8px;border-radius:2px;width:120px;z-index:15;font-size:11px;box-shadow:none;letter-spacing:0;text-transform:none}
.bar{height:4px;border-radius:2px;background:linear-gradient(90deg,#188038,#f9ab00,#d93025);margin-top:4px}
.toast{position:fixed;z-index:1800;left:50%;bottom:84px;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 16px;border-radius:4px;opacity:0;z-index:1800;pointer-events:none;max-width:90vw;font-size:14px}
.toast.show{opacity:1}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:1700}
.back.open{display:flex}
.modal{background:#fff;width:100%;max-width:480px;border-radius:8px 8px 0 0;padding:8px 16px max(16px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.modal::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:#dadce0;margin:6px auto 10px}
.modal h2{font:400 22px Roboto,Arial,sans-serif!important;margin:0 0 4px;color:#202124}
.modal p{color:#5f6368!important;font-size:13px}
.zone{border:1px dashed #dadce0;border-radius:8px;padding:28px 12px;text-align:center;background:#f8f9fa;margin:10px 0 12px;color:#3c4043;font-weight:500}
input{width:100%;border:0;border-bottom:1px solid #dadce0;border-radius:0;padding:12px 2px;margin-bottom:8px;font:16px Roboto,Arial,sans-serif;background:transparent;color:#202124}
input:focus{border-bottom-color:#1a73e8;box-shadow:none}
.loc{background:#f8f9fa;border-radius:8px;padding:10px 12px;font-size:13px;color:#3c4043;margin-bottom:12px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{border:0;border-radius:4px;padding:10px 16px;font-weight:500;font-size:14px;min-width:96px}
.cancel{background:transparent;color:#1a73e8}.go{background:#1a73e8;color:#fff}.go:disabled{opacity:.38}
#retake{margin-top:8px;border:0;background:transparent;color:#1a73e8;font-weight:500}
.preview img{width:100%;max-height:200px;object-fit:cover;border-radius:8px}
.pin-wrap{background:transparent;border:0}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.35)}
@media(max-width:700px){
  .gmbar{width:calc(100% - 16px);margin:8px;border-radius:24px;height:48px}
  .legend{display:none}
}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"] body{background:#202124;color:#e8eaed}
html[data-theme="dark"] .gmbar,
html[data-theme="dark"] #suggest,
html[data-theme="dark"] #routeNote,
html[data-theme="dark"] #appMenu,
html[data-theme="dark"] #langMenu,
html[data-theme="dark"] #langMenu button,
html[data-theme="dark"] .sug,
html[data-theme="dark"] .zoombar,
html[data-theme="dark"] .zbtn,
html[data-theme="dark"] .fab,
html[data-theme="dark"] .report,
html[data-theme="dark"] #panel,
html[data-theme="dark"] .modal,
html[data-theme="dark"] .item,
html[data-theme="dark"] .leaflet-popup-content-wrapper{background:#292a2d;color:#e8eaed}
html[data-theme="dark"] h1,
html[data-theme="dark"] .list-toggle,
html[data-theme="dark"] .panel-head h2,
html[data-theme="dark"] .modal h2,
html[data-theme="dark"] #dest,
html[data-theme="dark"] .zbtn{color:#e8eaed}
html[data-theme="dark"] .tag,
html[data-theme="dark"] .panel-head p,
html[data-theme="dark"] .modal p,
html[data-theme="dark"] #menuBtn{color:#9aa0a6}
html[data-theme="dark"] #dest{background:transparent}
html[data-theme="dark"] .list-toggle:hover,
html[data-theme="dark"] .item:hover,
html[data-theme="dark"] .sug:hover,
html[data-theme="dark"] #menuBtn:hover{background:#3c4043}
html[data-theme="dark"] #map,
html[data-theme="dark"] .leaflet-container{background:#202124}
html[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.55)}
html[data-theme="dark"] .leaflet-control-attribution{background:rgba(32,33,36,.85)!important;color:#9aa0a6}
html[data-theme="dark"] .zone,
html[data-theme="dark"] .loc{background:#3c4043;color:#e8eaed}
html[data-theme="dark"] input{color:#e8eaed;border-bottom-color:#5f6368}
html[data-theme="dark"] .sev-pick button{background:#3c4043;color:#e8eaed;border-color:#5f6368}
html[data-theme="dark"] .sev-pick button.on,
html[data-theme="dark"] #langMenu button.on{background:#394457;color:#8ab4f8}
.del{border:0;background:transparent;color:#d93025;font-weight:500;padding:8px 0;cursor:pointer}
</style>
<script>
(function(){try{var s=localStorage.getItem('roadwatch-theme');if(!s)s=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=s;}catch(e){}})();
</script>
</head>
<body>
<div id="app">
<header>
  <div class="gmbar">
    <button id="menuBtn" type="button" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
    <form id="routeForm">
      <input id="dest" type="search" data-i18n-ph="dest" placeholder="Where to? Bad roads are avoided" autocomplete="off" enterkeyhint="search">
      <button id="routeGo" type="submit" data-i18n="route">Route</button>
      <button id="routeClear" type="button" hidden data-i18n="clear">Clear</button>
    </form>
  </div>
</header>
<div id="menuScrim" hidden></div>
<nav id="appMenu" aria-label="Menu">
  <div class="menu-brand"><h1>RoadWatch</h1><div class="tag" data-i18n="tag">Live community map</div></div>
  <div class="head-actions">
    <button class="list-toggle" id="themeBtn" type="button" aria-label="Dark mode">Dark mode</button>
    <button class="list-toggle" id="langBtn" type="button" aria-label="Language">EN</button>
    <button class="list-toggle" id="panelToggle" type="button"><span data-i18n="priList">Priority list</span> <span id="count">0</span></button>
  </div>
</nav>
<main><div id="map"></div></main>
</div>
<aside id="panel"><div class="panel-head"><button id="panelClose" type="button" data-i18n="map">Map</button><div><h2 data-i18n="rankings">Rankings</h2><p data-i18n="rankHint">Sorted by how bad the road is. Tap a row to open it.</p></div></div><div id="panelList"></div></aside>
<div class="ui zoombar">
  <button class="zbtn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
  <button class="zbtn" id="zoomOut" type="button" aria-label="Zoom out">−</button>
  <button class="zbtn" id="mapTheme" type="button" aria-label="Dark mode">☾</button>
</div>
<div class="ui fabs">
  <button class="fab active" id="heatBtn" type="button" title="Hotspots" aria-label="Hotspots"></button>
  <button class="fab" id="locateBtn" type="button" title="My location" aria-label="My location">⌖</button>
  <button class="report" id="reportBtn" type="button" data-i18n="report">Report damage</button>
</div>
<div class="routebox" id="routeBox">
  <div id="suggest" hidden></div>
  <div id="routeNote" hidden></div>
</div>
<div class="legend" id="legend"><div data-i18n="hotspot">Hotspot density</div><div class="bar"></div></div>
<div id="langMenu" hidden></div>
<div class="toast" id="toast"></div>
<div class="back" id="back">
<div class="modal">
<h2 style="font-family:Oswald,sans-serif;margin:0 0 6px" data-i18n="reportTitle">Report road damage</h2>
<p style="color:#6b6b68;font-size:12.5px" data-i18n="reportHelp">Photo and GPS. A nearby report adds a confirm instead of a second pin.</p>
<label class="zone" id="zone"><span data-i18n="photo">Tap to take or choose a photo</span><input id="file" type="file" accept="image/*" capture="environment" hidden></label>
<div class="preview" id="preview" hidden><img id="previewImg" alt=""><button type="button" id="retake" data-i18n="retake">Retake</button></div>
<div class="loc" id="loc" data-i18n="finding">Finding your location…</div>
<input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" data-i18n-ph="phonePh" placeholder="Your phone number">
<input id="phone2" type="tel" inputmode="numeric" autocomplete="tel" maxlength="14" data-i18n-ph="phone2" placeholder="Type the same number again">
<p class="how" data-i18n="how">How bad is the road?</p>
<div class="sev-pick" id="sevPick">
  <button type="button" data-sev="minor" data-i18n="minor">Minor</button>
  <button type="button" data-sev="rough" data-i18n="rough">Rough</button>
  <button type="button" data-sev="severe" data-i18n="severe">Severe</button>
  <button type="button" data-sev="dangerous" data-i18n="dangerous">Dangerous</button>
</div>
<input id="note" type="text" data-i18n-ph="notePh" placeholder="Short note (optional)" maxlength="140">
<div class="actions"><button class="btn cancel" id="cancel" type="button" data-i18n="cancel">Cancel</button><button class="btn go" id="submit" type="button" disabled data-i18n="submit">Submit report</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<script>
const KEY='roadwatch-live-v2';
let map,markers,heat,pins=[],me,accCircle,myPos,photo,reportPos,heatOn=true,zooming=false,reportWatch=null,reportSev=null;

let lang=localStorage.getItem('roadwatch-lang')||'en';
if(!I18N[lang]) lang='en';
let lastNote=null;
function tr(k){const pack=I18N[lang]||I18N.en;let s=(pack[k]!=null?pack[k]:(I18N.en[k]!=null?I18N.en[k]:k));for(let i=1;i<arguments.length;i++)s=s.split('{'+(i-1)+'}').join(String(arguments[i]));return s}
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=tr(el.getAttribute('data-i18n'))});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=tr(el.getAttribute('data-i18n-ph'))});
  const b=$('langBtn'); if(b) b.textContent=lang.toUpperCase();
  if(lastNote){$('routeNote').hidden=false;$('routeNote').textContent=tr.apply(null,lastNote)}
  if(typeof map!=='undefined'&&map&&typeof draw==='function') draw();
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
const WORDS={minor:{c:'#4c7a5e',k:'sev-reported',r:1},rough:{c:'#e0a106',k:'sev-confirmed',r:2},severe:{c:'#c4432b',k:'sev-priority',r:3},dangerous:{c:'#7a1f14',k:'sev-danger',r:4}};
function sevOf(p){if(p&&WORDS[p.severity])return Object.assign({l:tr(p.severity)},WORDS[p.severity]);const v=(p&&p.votes)||1;if(v>=5)return{l:tr('priority'),c:'#c4432b',k:'sev-priority',r:3};if(v>=2)return{l:tr('confirmed'),c:'#f2a93b',k:'sev-confirmed',r:2};return{l:tr('reported'),c:'#4c7a5e',k:'sev-reported',r:1}}
function ago(iso){const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,x=r(c-a),y=r(d-b),k=Math.sin(x/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(k),Math.sqrt(1-k))}
function pinIcon(color){return L.divIcon({className:'pin-wrap',html:'<div class="pin" style="background:'+color+'"></div>',iconSize:[26,26],iconAnchor:[13,24],popupAnchor:[0,-22]})}
function load(){
  try{pins=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('roadwatch-live-v1')||'[]')}catch(e){pins=[]}
  if(!Array.isArray(pins))pins=[];
  pins=pins.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng));
  draw();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(pins));return}
  catch(e){
    const lite=pins.map(p=>({id:p.id,lat:p.lat,lng:p.lng,accuracy:p.accuracy,votes:p.votes,note:p.note||'',severity:p.severity||'',owner:p.owner||(p.voters&&p.voters[0])||'',firstReported:p.firstReported,voters:p.voters||[],photo:''}));
    try{localStorage.setItem(KEY,JSON.stringify(lite));toast(tr('photoBig'))}
    catch(e2){toast(tr('noStore'))}
  }
}
function ownerOf(p){return mobile(p.owner||(p.voters&&p.voters[0])||'')}
function canDelete(p){const me=mobile(localStorage.getItem('roadwatch-phone')||'');return !!(me&&me===ownerOf(p))}
function deleteReport(id){const p=pins.find(x=>x.id===id);if(!p)return;if(!canDelete(p)){toast(tr('notYours'));return}if(!confirm(tr('deleteAsk')))return;pins=pins.filter(x=>x.id!==id);save();draw();toast(tr('deleted'))}
function popupHtml(p,s){
  const img=p.photo?'<img src="'+p.photo+'" alt="" style="width:100%;height:110px;object-fit:cover;border-radius:6px">':'';
  const note=p.note?'<div>'+String(p.note).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>':'';
  const del=canDelete(p)?'<button type="button" class="del" data-del="'+p.id+'">'+tr('delete')+'</button>':'';
  return img+'<div><b>'+s.l+'</b> · '+tr(p.votes===1?'oneReport':'manyReports', p.votes)+'</div>'+note+'<div style="color:#6b6b68">'+ago(p.firstReported)+'</div>'+del;
}
function syncHeat(){
  if(heat){map.removeLayer(heat);heat=null}
  if(!heatOn||zooming||!pins.length||map.getZoom()<12)return;
  heat=L.heatLayer(pins.map(p=>[p.lat,p.lng,sevOf(p).r]),{radius:28,blur:22,max:5,minOpacity:.28,gradient:{0:'#4c7a5e',.6:'#f2a93b',1:'#c4432b'}}).addTo(map);
}
function draw(){
  $('count').textContent=pins.length;
  markers.clearLayers();
  pins.forEach(p=>{
    const s=sevOf(p);
    L.circle([p.lat,p.lng],{radius:20,color:s.c,weight:2,fillColor:s.c,fillOpacity:.18,pane:'pins'}).addTo(markers);
    const m=L.marker([p.lat,p.lng],{icon:pinIcon(s.c),pane:'pins',zIndexOffset:500+ (p.votes||1)}).addTo(markers);
    m.bindPopup(popupHtml(p,s));
    p._m=m;
  });
  syncHeat();
  const list=$('panelList');
  list.replaceChildren();
  if(!pins.length){list.innerHTML='<div class="empty">'+tr('empty')+'</div>';return}
  const sorted=pins.slice().sort((a,b)=>((sevOf(b).r*100)+(b.votes||1))-((sevOf(a).r*100)+(a.votes||1)));
  sorted.forEach((p,i)=>{
    const s=sevOf(p);
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='item';
    const rank=document.createElement('div');
    rank.className='rank';
    rank.textContent=String(i+1);
    const thumb=document.createElement(p.photo?'img':'div');
    thumb.className='thumb';
    if(p.photo)thumb.src=p.photo;
    const body=document.createElement('div');
    body.style.flex='1';
    const word=document.createElement('span');
    word.className='sev '+s.k+' sev-word';
    word.textContent=s.l;
    const when=document.createElement('div');
    when.style.cssText='font-size:11.5px;color:#6b6b68';
    when.textContent=ago(p.firstReported);
    body.append(word,when);
    if(p.note){
      const note=document.createElement('div');
      note.className='note-word';
      note.textContent=p.note;
      body.append(note);
    }
    const votes=document.createElement('div');
    votes.className='votes';
    votes.textContent=String(p.votes||1);
    btn.append(rank,thumb,body,votes);
    btn.onclick=()=>goToReport(p);
    if(canDelete(p)){
      const del=document.createElement('button');
      del.type='button';
      del.className='del';
      del.textContent=tr('delete');
      del.onclick=ev=>{ev.stopPropagation();deleteReport(p.id)};
      btn.append(del);
    }
    list.append(btn);
  });
}
function goToReport(p){
  $('panel').classList.remove('open');
  setTimeout(()=>{
    map.invalidateSize();
    map.flyTo([p.lat,p.lng],18,{duration:.6});
    if(p._m)p._m.openPopup();
  },260);
}
function showMe(lat,lng,acc){
  myPos={lat,lng,acc:acc||20};
  if(!me){
    accCircle=L.circle([lat,lng],{radius:20,color:'#2563eb',weight:2,fillColor:'#3b82f6',fillOpacity:.15,pane:'me'}).addTo(map);
    me=L.circleMarker([lat,lng],{radius:7,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1,pane:'me'}).addTo(map);
  }else{
    me.setLatLng([lat,lng]);
    accCircle.setLatLng([lat,lng]);
    accCircle.setRadius(20);
  }
}
function applyFix(pos){
  reportPos={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy||20,at:Date.now()};
  showMe(reportPos.lat,reportPos.lng,reportPos.acc);
  $('loc').textContent=tr('locUpdated');
  ready();
}
function stopWatch(){
  if(reportWatch!=null && navigator.geolocation){navigator.geolocation.clearWatch(reportWatch);reportWatch=null}
}
function freshFix(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){rej(new Error('no gps'));return}
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
}
function locate(recenter){
  if(!navigator.geolocation){toast(tr('noGps'));return}
  navigator.geolocation.getCurrentPosition(pos=>{
    showMe(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy);
    if(recenter)map.setView([pos.coords.latitude,pos.coords.longitude],16);
  },()=>toast(tr('allowGps')),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
function compress(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=360;
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*s));
        c.height=Math.max(1,Math.round(img.height*s));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.5));
      };
      img.onerror=()=>rej(new Error('photo'));
      img.src=r.result;
    };
    r.onerror=()=>rej(new Error('read'));
    r.readAsDataURL(file);
  });
}
function mobile(v){let d=String(v||'').replace(/\D/g,'');if(d.length>10)d=d.slice(-10);return /^[6-9]\d{9}$/.test(d)?d:''}

  if(!phone){toast(tr('badPhone'));return}
  if(phone!==again){toast(tr('mismatch'));return}
  let match=null,best=1e9;
  pins.forEach(p=>{

    const rad=20;
    if(d<=rad&&d<best){best=d;match=p}
  });
  if(match){
    if((match.voters||[]).some(v=>mobile(v)===phone)){toast(tr('already'));return}
    match.votes=(match.votes||1)+1;
    match.voters=match.voters||[];
    match.voters.push(phone);
    if(!match.photo)match.photo=photo;
    if(WORDS[reportSev]&&(!WORDS[match.severity]||WORDS[reportSev].r>WORDS[match.severity].r))match.severity=reportSev;
  }else{
    pins.push({id:'p_'+Date.now(),lat:reportPos.lat,lng:reportPos.lng,accuracy:reportPos.acc||15,votes:1,photo,note:$('note').value.trim(),severity:reportSev,owner:phone,firstReported:new Date().toISOString(),voters:[phone]});
  }
  stopWatch();
  localStorage.setItem('roadwatch-phone',phone);
  save();
  draw();
  $('back').classList.remove('open');
  const target=match||pins[pins.length-1];
  map.setView([target.lat,target.lng],17);
  setTimeout(()=>{if(target._m)target._m.openPopup()},300);
  toast(match?tr('confirmedPin'):tr('dropped'));
};

let routeLayer=null,destPos=null,suggestTimer=null;
function segDist(lat,lng,a,b){
  const mlat=111320, mlng=111320*Math.cos(lat*Math.PI/180);
  const x=lng*mlng, y=lat*mlat, x1=a[0]*mlng, y1=a[1]*mlat, x2=b[0]*mlng, y2=b[1]*mlat;
  const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
  let u=l2?((x-x1)*dx+(y-y1)*dy)/l2:0;
  u=Math.max(0,Math.min(1,u));
  return Math.hypot(x-(x1+u*dx), y-(y1+u*dy));
}
function hitsOn(coords){
  const bad=[];
  if(!coords||coords.length<2) return bad;
  pins.forEach(p=>{
    let best=1e9;
    const step=coords.length>2500?2:1;
    for(let i=step;i<coords.length;i+=step){
      const d=segDist(p.lat,p.lng,coords[i-step],coords[i]);
      if(d<best) best=d;
      if(best<=28) break;
    }
    if(best<=28) bad.push(p);
  });
  return bad;
}
function sidePoints(pin,coords){
  let bi=1, bd=1e9;
  for(let i=1;i<coords.length;i++){
    const d=segDist(pin.lat,pin.lng,coords[i-1],coords[i]);
    if(d<bd){bd=d;bi=i}
  }
  const a=coords[bi-1], b=coords[bi];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  const len=Math.hypot(dx,dy)||1e-9;
  const ux=-dy/len, uy=dx/len;
  const mlat=90/111320, mlng=90/(111320*Math.cos(pin.lat*Math.PI/180));
  return [{lat:pin.lat+uy*mlat,lng:pin.lng+ux*mlng},{lat:pin.lat-uy*mlat,lng:pin.lng-ux*mlng}];
}
async function osrm(points,alts){
  const path=points.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
  const url='https://router.project-osrm.org/route/v1/driving/'+path+'?overview=full&geometries=geojson&alternatives='+(alts?'true':'false');
  const r=await fetch(url);
  if(!r.ok) throw new Error('route');
  const j=await r.json();
  if(!j.routes||!j.routes.length) throw new Error('noroute');
  return j.routes.map(rt=>({coords:rt.geometry.coordinates,km:rt.distance/1000,min:rt.duration/60}));
}
function showRoute(rt,directBad){
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}
  const latlngs=rt.coords.map(c=>[c[1],c[0]]);
  routeLayer=L.polyline(latlngs,{color:rt.bad.length?'#d93025':'#1a73e8',weight:6,opacity:.92}).addTo(map);
  map.fitBounds(routeLayer.getBounds(),{padding:[120,48]});
  const note=$('routeNote');
  note.hidden=false;
  $('routeClear').hidden=false;
  const mins=Math.max(1,Math.round(rt.min));
  const km=rt.km<10?rt.km.toFixed(1):String(Math.round(rt.km));
  if(!rt.bad.length && directBad) lastNote=['rerouted',km,mins];
  else if(rt.bad.length) lastNote=[rt.bad.length>1?'noClearMany':'noClear',rt.bad.length,km,mins];
  else lastNote=['clearRoad',km,mins];
  note.textContent=tr.apply(null,lastNote);
}
async function planRoute(){
  if(!myPos){toast(tr('needStart'));locate(true);return}
  if(!destPos){toast(tr('needDest'));return}
  $('routeGo').disabled=true;
  $('routeNote').hidden=false;
  $('routeNote').textContent=tr('checkingRoads');
  try{
    const routes=await osrm([myPos,destPos],true);
    let best=null;
    routes.forEach(rt=>{
      const bad=hitsOn(rt.coords);
      const score=bad.length*100000+rt.min;
      if(!best||score<best.score) best={...rt,bad,score};
    });
    const directBad=best.bad.length;
    if(directBad){
      const blockers=best.bad.slice(0,3);
      for(const pin of blockers){
        for(const side of sidePoints(pin,best.coords)){
          try{
            const via=(await osrm([myPos,side,destPos],false))[0];
            const bad=hitsOn(via.coords);
            const score=bad.length*100000+via.min+1;
            if(score<best.score) best={...via,bad,score};
          }catch(e){}
        }
      }
    }
    showRoute(best,directBad);
  }catch(e){
    $('routeNote').textContent=tr('routeFail');
    toast(tr('routeToast'));
  }
  $('routeGo').disabled=false;
}
async function searchDest(q){
  const box=$('suggest');
  if(q.trim().length<2){box.hidden=true;box.innerHTML='';return}
  const bias=myPos?('&lat='+myPos.lat+'&lon='+myPos.lng):'';
  const r=await fetch('https://photon.komoot.io/api/?limit=5&q='+encodeURIComponent(q)+bias);
  const j=await r.json();
  const feats=j.features||[];
  if(!feats.length){box.hidden=true;return}
  box.hidden=false;
  box.innerHTML='';
  feats.forEach(f=>{
    const props=f.properties||{};
    const label=[props.name,props.street,props.city,props.state,props.country].filter(Boolean);
    const text=[...new Set(label)].slice(0,3).join(', ')||q;
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='sug';
    btn.textContent=text;
    btn.onclick=()=>{
      destPos={lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]};
      $('dest').value=text;
      box.hidden=true;
      planRoute();
    };
    box.append(btn);
  });
}
$('routeForm').onsubmit=async e=>{
  e.preventDefault();
  $('suggest').hidden=true;
  if(!destPos){
    try{await searchDest($('dest').value)}catch(err){toast(tr('searchFail'));return}
    const first=$('suggest').querySelector('.sug');
    if(first){first.click();return}
    toast(tr('noPlace'));
    return;
  }
  planRoute();
};
$('dest').oninput=()=>{
  destPos=null;
  clearTimeout(suggestTimer);
  suggestTimer=setTimeout(()=>searchDest($('dest').value).catch(()=>{}),280);
};
$('routeClear').onclick=()=>{

  $('routeClear').hidden=true;
};

function paintTheme(){
  const dark=document.documentElement.dataset.theme==='dark';
  const words=dark?'Light mode':'Dark mode';
  const theme=$('themeBtn'); if(theme){theme.textContent=words;theme.setAttribute('aria-label',words)}
  const mapT=$('mapTheme'); if(mapT){mapT.textContent=dark?'☀':'☾';mapT.setAttribute('aria-label',words)}
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', dark?'#16130f':'#fbf7f1');
}
function toggleTheme(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=next;
  localStorage.setItem('roadwatch-theme', next);
  paintTheme();
}
$('themeBtn').onclick=toggleTheme;
